# =============================================================================
# PR Quality Pipeline — TypeCheck · Lint · Build
# =============================================================================
#
# Runs on every Pull Request targeting main or develop.
# Blocks merging if typecheck, lint, or the Next.js build fails.
#
# Does NOT run deployments — see deploy.yml for that.
# =============================================================================

name: PR Quality Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: TypeCheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build doesn't fail on missing env vars
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder