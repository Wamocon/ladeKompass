# =============================================================================
# Caller Workflow — PR Pipeline (Auto-Fix + Checks)
# =============================================================================
# Source: Wamocon/github_workflow/examples/caller-pr-pipeline.yml
#
# This workflow runs on every Pull Request targeting main/master.
# It auto-fixes lint/format issues then validates with typecheck + lint.
#
# SETUP — one thing to do:
#   Settings → Actions → General → Workflow permissions
#     Enable "Allow GitHub Actions to create and approve pull requests"
#     (required for the auto-fix commit-back to work)
#
# Deployment (preview + production) is handled separately by deploy.yml.
# =============================================================================

name: PR Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

# Cancel redundant runs on the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Step 1: Auto-fix lint & format errors --------------------------------
  autofix:
    name: Auto-Fix
    uses: Wamocon/github_workflow/.github/workflows/pr-autofix.yml@main
    permissions:
      contents: write

  # --- Step 2: Validate code (typecheck + lint) -----------------------------
  validate:
    name: PR Checks
    needs: autofix
    uses: Wamocon/github_workflow/.github/workflows/pr-checks.yml@main
