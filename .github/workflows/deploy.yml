# =============================================================================
# Vercel Deployment — Preview on Push · Production on Release · Manual
# =============================================================================
#
# Trigger overview:
#   push (any branch)   → Preview deploy
#                         NOTE: Only 'push' is used here — no 'pull_request'
#                         trigger, so a push inside a PR fires exactly ONCE.
#   release: published  → Production deploy
#   workflow_dispatch   → Manual: choose production or preview
#
# Secrets required:
#   - VERCEL_PROJECT_ID (repo secret)
# Already set at org level (no action needed):
#   - VERCEL_TOKEN, VERCEL_ORG_ID
# =============================================================================

name: Deploy to Vercel

permissions: {}

on:
  push:
    branches: ["**"]   # every branch push → preview (tags excluded automatically)
  release:
    types: [published] # published GitHub Release → production
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      db_schema:
        description: "Optional NEXT_PUBLIC_DB_SCHEMA override (leave empty to use Vercel env vars)"
        required: false
        type: string
        default: ""

jobs:
  # ── Preview deploy ────────────────────────────────────────────────────────
  preview:
    name: Preview Deploy
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
    uses: Wamocon/github_workflow/.github/workflows/deploy.yml@main
    with:
      vercel_env: preview
      db_schema: ${{ inputs.db_schema || '' }}
    secrets: inherit

  # ── Production deploy ─────────────────────────────────────────────────────
  production:
    name: Production Deploy
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: Wamocon/github_workflow/.github/workflows/deploy.yml@main
    with:
      vercel_env: production
      db_schema: ${{ inputs.db_schema || '' }}
    secrets: inherit