# =============================================================================
# Vercel Deployment — Preview on Push · Production on Release · Manual
# =============================================================================
#
# Trigger overview:
#   push (any branch)   → Preview deploy (inlined, NOT via shared workflow)
#                         Branch name is forwarded via VERCEL_GIT_COMMIT_REF so
#                         Vercel can assign branch-based custom domains
#                         (e.g. test.ladekompass.com → test branch).
#                         IMPORTANT: GITHUB_ACTIONS and GITHUB_REPOSITORY are
#                         always cleared before any vercel CLI call, so Vercel
#                         never receives the GitHub actor / user identity.
#   release: published  → Production deploy (via shared workflow)
#   workflow_dispatch   → Manual: choose production or preview
#
# Secrets required (repo level):
#   - VERCEL_PROJECT_ID
# Set at org level (no action needed):
#   - VERCEL_TOKEN, VERCEL_ORG_ID, ORG_PAT
# =============================================================================

name: Deploy to Vercel

permissions: {}

on:
  push:
    branches: ["**"]   # every branch push → preview (tags excluded automatically)
  release:
    types: [published] # published GitHub Release → production
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      db_schema:
        description: "Optional NEXT_PUBLIC_DB_SCHEMA override (leave empty to use Vercel env vars)"
        required: false
        type: string
        default: ""

jobs:
  # ── Preview deploy (inlined) ───────────────────────────────────────────────
  # Inlined instead of using the shared workflow so we can set
  # VERCEL_GIT_COMMIT_REF (branch name, NOT a user identity) in the deploy
  # step. The shared workflow does not expose this as an input.
  # GITHUB_ACTIONS and GITHUB_REPOSITORY are cleared before every vercel CLI
  # call → Vercel never sees the GitHub actor or Hobby-plan user identity.
  preview:
    name: Preview Deploy
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "1"
      FORCE_COLOR: "0"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sever Git Linkage
        # Removes .git so vercel CLI cannot read git metadata that would expose
        # the GitHub user identity to Vercel (Hobby plan restriction).
        run: rm -rf .git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Apply DB schema
        run: |
          SCHEMA="${{ inputs.db_schema }}"
          if [[ -z "$SCHEMA" ]]; then SCHEMA="public"; fi
          echo "NEXT_PUBLIC_DB_SCHEMA=$SCHEMA" >> "$GITHUB_ENV"
          echo "DB schema set to: $SCHEMA"

      - name: Build project
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        env:
          # VERCEL_GIT_COMMIT_REF is the branch name only (e.g. "test").
          # It is NOT a user identity — it tells Vercel which branch this
          # deployment belongs to so branch-based domain rules apply
          # (test.ladekompass.com → test branch).
          # GITHUB_ACTIONS and GITHUB_REPOSITORY are cleared below so Vercel
          # never reads GITHUB_ACTOR or any other user credential.
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          set -euo pipefail

          rm -f vercel-deploy.log
          deploy_ok=false

          if vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }} > vercel-deploy.log 2>&1; then
            deploy_ok=true
          fi

          echo "=========================================="
          echo " FULL VERCEL DEPLOY LOG"
          echo "=========================================="
          cat vercel-deploy.log || true
          echo "=========================================="

          if [[ "$deploy_ok" != "true" ]]; then
            echo "### Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' vercel-deploy.log \
            | grep -v '^$' | tail -n 1 || true)

          if [[ -n "$DEPLOY_URL" ]]; then
            echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployed to Vercel"
              echo "**Environment:** preview"
              echo "**Branch:** ${{ github.ref_name }}"
              echo "**Schema:** ${{ inputs.db_schema || 'public' }}"
              echo "**URL:** $DEPLOY_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Production deploy (shared workflow) ───────────────────────────────────
  production:
    name: Production Deploy
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: Wamocon/github_workflow/.github/workflows/deploy.yml@main
    with:
      vercel_env: production
      db_schema: ${{ inputs.db_schema || '' }}
    secrets: inherit